name: CI

on:
  push:
    branches: [main]
  pull_request:

# A PR that breaks persistence, the endpoint contract or the chat loop should
# fail here rather than in a manual ten-step click-through that only the
# maintainer can run.
jobs:
  backend:
    name: backend contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # Run the SAME contract suite against both servers. This is what makes
      # "the FastAPI move is byte-identical" a checked claim rather than an
      # assertion. The native-dialog endpoints shell out to osascript and are
      # faked in conftest.py, so both run on Linux.
      - run: pytest tests/contract
        env:
          NOTLINEAR_SERVER: legacy
      - run: pytest tests/contract
        env:
          NOTLINEAR_SERVER: fastapi
      # The /web/* dev proxy (HTTP passthrough + HMR websocket pump), against a
      # fake Vite. Independent of NOTLINEAR_SERVER.
      - run: pytest tests/proxy
      # The server's port probe (BUGS.md #054).
      - run: pytest tests/server

  frontend:
    name: typecheck and schema tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # P7 gate: seams must not edit provider files. Needs full history to find the P7 commits.
      - run: node scripts/check-p7-providers-untouched.mjs
      # Includes the no-literal-colour rule (bug #022), which is also exercised
      # by a test that feeds it offenders, so it cannot silently stop firing.
      - run: pnpm lint
      # Includes the differential oracle against the real frontend/core/store.js
      # and the frozen-schema assertions.
      - run: pnpm test

  e2e:
    name: end-to-end smoke (legacy app + /web shell)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The e2e webServer runs backend/server.py, which needs FastAPI since P2.
      - run: pip install -r requirements.txt
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
