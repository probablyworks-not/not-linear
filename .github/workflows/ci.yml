name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # Endpoint contract, the static allowlist, the /web dev proxy and the server's port probe.
      # The native-dialog endpoints shell out to osascript and are faked, so this runs on Linux.
      - run: pytest tests

  web:
    name: typecheck, lint, unit tests, licences
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Includes the no-literal-colour rule, which is also exercised by a test that
      # feeds it offenders, so it cannot silently stop firing.
      - run: pnpm lint
      - run: pnpm test
      # Fails on an unreviewed or copyleft/commercial licence in the production tree.
      - run: pnpm check:licenses

  e2e:
    name: end-to-end (built app, Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The e2e web server runs backend/server.py, which needs FastAPI.
      - run: pip install -r ../requirements.txt
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
