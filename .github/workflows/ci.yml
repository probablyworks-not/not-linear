name: CI

on:
  push:
    branches: [main]
  pull_request:

# A PR that breaks persistence, the endpoint contract or the chat loop should
# fail here rather than in a manual ten-step click-through that only the
# maintainer can run.
jobs:
  backend:
    name: backend contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      # The native-dialog endpoints shell out to osascript and are faked in
      # conftest.py, so this suite runs on Linux despite the app being
      # macOS-first for those features.
      - run: pytest tests/contract
        env:
          NOTLINEAR_SERVER: legacy

  frontend:
    name: typecheck and schema tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Includes the differential oracle against the real frontend/core/store.js
      # and the frozen-schema assertions.
      - run: pnpm test

  e2e:
    name: end-to-end smoke (legacy app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
