<!--
  debug-keys.html — standalone local dev utility, not part of the app shell.

  Not linked from index.html, not registered as a view, and not loaded by
  backend/server.py's normal routing beyond serving it as a static file if
  requested directly (e.g. http://127.0.0.1:8765/frontend/debug-keys.html).
  It is a bare page (no shared styles/tokens.css, no core/*.js) for poking at
  the `nl_api_keys` localStorage entry that Settings > API Keys reads/writes
  in the main app (see index.html #api-key-list / #api-key-add).

  Security note (per AGENTS.md "Security rules" — never log API keys): this
  page does not console.log full key values (only a redacted "Added"/
  "Deleted <provider>" message), but it DOES render each stored key's first
  4 and last 4 characters directly in the DOM (see displayKeys() below) and
  lets you add/inspect a raw key value in the "Add a Test Key" password
  input. That is a deliberate debug affordance for local development, not a
  logging violation — but treat this file as something to keep out of any
  screen-share/screenshot, and do not extend it to print full key values.
-->
<!DOCTYPE html>
<html>
<head>
  <title>API Key Debugger</title>
  <!-- Inline, self-contained styles — dark monospace debug-console look, no shared tokens.css since this page is intentionally independent of the app shell. -->
  <style>
    body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #eee; }
    .section { margin: 20px 0; border: 1px solid #555; padding: 15px; border-radius: 5px; }
    h2 { margin-top: 0; color: #4ade80; }
    pre { background: #111; padding: 10px; border-radius: 3px; overflow-x: auto; }
    button { padding: 10px 20px; margin: 5px 5px 5px 0; background: #4ade80; color: #000; border: none; border-radius: 3px; cursor: pointer; }
    button:hover { background: #22c55e; }
    .key-entry { background: #222; padding: 10px; margin: 5px 0; border-radius: 3px; display: flex; justify-content: space-between; align-items: center; }
    .error { color: #f87171; }
    .success { color: #4ade80; }
  </style>
</head>
<body>

<h1>🔑 API Key Debugger</h1>

<!-- Section 1: dump of whatever is currently in the `nl_api_keys` localStorage
     key, one row per provider, with a masked view of the value (see
     displayKeys()). This mirrors what the main app's Settings > API Keys
     list shows, but unmasked enough (first/last 4 chars + length) to spot
     which key is which during debugging. -->
<div class="section">
  <h2>Stored Keys (localStorage)</h2>
  <div id="stored-keys"></div>
  <button onclick="location.reload()">Refresh</button>
  <button onclick="clearAllKeys()">⚠️ Clear All Keys</button>
</div>

<!-- Section 2: manually write a provider/key pair into `nl_api_keys` without
     going through the real app UI — useful for testing the key list
     rendering or a specific provider's fallback logic in isolation. -->
<div class="section">
  <h2>Add a Test Key</h2>
  <input type="text" id="test-provider" placeholder="Provider (e.g., anthropic)" style="padding:8px; width:200px;">
  <input type="password" id="test-key" placeholder="API Key" style="padding:8px; width:200px;">
  <button onclick="addTestKey()">Add Key</button>
</div>

<!-- Section 3: remove a single provider's key from `nl_api_keys` — exercises
     the same delete path a user would trigger from Settings > API Keys. -->
<div class="section">
  <h2>Test Delete</h2>
  <select id="delete-provider" style="padding:8px;">
    <option value="">-- Select a key to delete --</option>
  </select>
  <button onclick="deleteTestKey()">Delete Selected</button>
</div>

<!-- Section 4: sanity-check that localStorage is actually available/writable
     in the current browser context (relevant since the whole app depends on
     localStorage for keys/theme and IndexedDB/Dexie for chat state). -->
<div class="section">
  <h2>Browser Capabilities</h2>
  <pre id="capabilities"></pre>
</div>

<script>
// Renders the "Stored Keys" list (Section 1) and repopulates the "Test
// Delete" dropdown (Section 3) from whatever is currently in the
// `nl_api_keys` localStorage entry. Called on load and after every mutation
// (add/delete/clear) so the page always reflects current storage state.
function displayKeys() {
  const stored = localStorage.getItem('nl_api_keys');
  const keys = stored ? JSON.parse(stored) : {};
  const container = document.getElementById('stored-keys');

  if (!Object.keys(keys).length) {
    container.innerHTML = '<p style="color: #999;">No keys stored.</p>';
    return;
  }

  container.innerHTML = Object.entries(keys).map(([provider, key]) => `
    <div class="key-entry">
      <span><strong>${provider}</strong>: ${key.slice(0,4)}...${key.slice(-4)} (${key.length} chars)</span>
      <button onclick="deleteKey('${provider}')">Delete</button>
    </div>
  `).join('');

  // Update delete dropdown
  const select = document.getElementById('delete-provider');
  select.innerHTML = '<option value="">-- Select a key to delete --</option>' +
    Object.keys(keys).map(p => `<option value="${p}">${p}</option>`).join('');
}

// Removes one provider's entry from `nl_api_keys` and re-renders. Only logs
// the provider name to console, never the key value.
function deleteKey(provider) {
  const keys = JSON.parse(localStorage.getItem('nl_api_keys') || '{}');
  delete keys[provider];
  localStorage.setItem('nl_api_keys', JSON.stringify(keys));
  console.log(`✅ Deleted ${provider}`);
  displayKeys();
}

// Wipes the entire `nl_api_keys` object (all providers) after a confirm
// dialog — the "⚠️ Clear All Keys" destructive action in Section 1.
function clearAllKeys() {
  if (confirm('Delete ALL stored API keys?')) {
    localStorage.setItem('nl_api_keys', '{}');
    console.log('✅ Cleared all keys');
    displayKeys();
  }
}

// Reads the provider/key inputs from Section 2, writes them into
// `nl_api_keys`, then clears the inputs and re-renders. console.log only
// echoes the provider name, not the key value.
function addTestKey() {
  const provider = document.getElementById('test-provider').value.trim();
  const key = document.getElementById('test-key').value.trim();

  if (!provider || !key) {
    alert('Please fill in both fields');
    return;
  }

  const keys = JSON.parse(localStorage.getItem('nl_api_keys') || '{}');
  keys[provider] = key;
  localStorage.setItem('nl_api_keys', JSON.stringify(keys));

  document.getElementById('test-provider').value = '';
  document.getElementById('test-key').value = '';
  console.log(`✅ Added ${provider}`);
  displayKeys();
}

// Handler for Section 3's "Delete Selected" button — delegates to deleteKey().
function deleteTestKey() {
  const provider = document.getElementById('delete-provider').value;
  if (!provider) return;
  deleteKey(provider);
}

// Populates Section 4 with a quick localStorage-availability check and a
// truncated user-agent string, for diagnosing storage issues in a given browser.
function checkCapabilities() {
  const info = {
    'localStorage available': typeof localStorage !== 'undefined',
    'localStorage can set': (() => {
      try { localStorage.setItem('__test__', '1'); localStorage.removeItem('__test__'); return true; } catch(_) { return false; }
    })(),
    'User agent': navigator.userAgent.slice(0, 50) + '...',
  };

  document.getElementById('capabilities').textContent = JSON.stringify(info, null, 2);
}

// Init — render current state as soon as the page loads.
displayKeys();
checkCapabilities();
</script>

</body>
</html>
