<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>notlinear</title>
<link rel="icon" href="/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<!-- Saved replies carry Tabler icon markup (<i class="ti ...">): error icons, the usage receipt, chevrons. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css">
<!-- Pre-paint theme guard. It is inline and synchronous on purpose: it must run before
     first paint so a light/grey user never sees a flash of the default dark theme. -->
<script>(function(){var t=localStorage.getItem('nl_theme')||'light';if(t==='light'||t==='grey')document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
