<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Stacked HTML sections prototype</title>
<style>
:root{color-scheme:light dark;font:16px/1.6 system-ui;color:var(--text,CanvasText);background:var(--bg,Canvas)}body{margin:0}header{position:sticky;top:0;z-index:2;padding:16px 24px;background:var(--bg,Canvas);border-bottom:1px solid var(--cv-edge,GrayText)}h1{font-size:18px;margin:0}button{font:inherit;color:inherit;background:var(--cv-card,Canvas);border:1px solid var(--cv-edge,GrayText);border-radius:8px;padding:5px 12px;margin:8px 8px 0 0;cursor:pointer}#pages{width:min(880px,calc(100% - 32px));margin:24px auto}.page{box-sizing:border-box;padding:24px;margin-bottom:24px;border:1px solid var(--cv-edge,GrayText);border-radius:12px;position:relative}.block{margin:0;padding-bottom:16px;overflow-wrap:anywhere}table{border-collapse:collapse;width:100%}th,td{padding:8px;border:1px solid var(--cv-edge,GrayText);text-align:left}canvas{max-width:100%;height:auto}.pending{min-height:180px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--text-3,GrayText)}.pending::before{content:'';position:absolute;inset:-100%;background:linear-gradient(125deg,transparent 43%,color-mix(in srgb,currentColor 10%,transparent) 50%,transparent 57%);transform:translateX(-35%);animation:sweep 2.4s ease-in-out infinite;pointer-events:none}@keyframes sweep{to{transform:translateX(35%)}}@media(prefers-reduced-motion:reduce){.pending::before{animation:none;transform:none}}#status{font-size:13px;color:var(--text-3,GrayText)}#measure{position:absolute;visibility:hidden;pointer-events:none;left:0;top:0;box-sizing:border-box;padding:0 24px}
</style>
<header><h1>Stacked HTML sections · experimental prototype</h1><div id="status" role="status">This prototype does not modify saved conversations.</div><nav aria-label="Fixtures"><button data-fixture="short">Short answer</button><button data-fixture="long">Long report</button><button data-fixture="table">Table</button><button data-fixture="chart">Interactive chart</button><button data-fixture="stream">Simulate generation</button><button id="stop">Stop</button></nav></header>
<main id="pages" aria-label="One answer in multiple sections"></main><div id="measure" aria-hidden="true"></div><script type="module" src="./demo.mjs"></script></html>
